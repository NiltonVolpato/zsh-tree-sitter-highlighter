[workspace]
members = ["treeizsh", "treeizsh-module", "tests"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NiltonVolpato/zsh-tree-sitter-highlighter"
description = "A Zsh syntax highlighter using tree-sitter"
readme = "README.md"

[workspace.dependencies]
# Local workspace packages
treeizsh = { path = "treeizsh" }
treeizsh-module = { path = "treeizsh-module" }

# External / Local oxizsh components
oxizsh = { path = "/Users/nilton/Code/zsh-module-worktree/main/oxizsh" }
oxizsh-module = { path = "/Users/nilton/Code/zsh-module-worktree/main/module" }
oxizsh-build = { path = "/Users/nilton/Code/zsh-module-worktree/main/oxizsh-build" }
oxizsh-test = { path = "/Users/nilton/Code/zsh-module-worktree/main/oxizsh-test" }

# Shared external dependencies
anyhow = "1"
libc = "0.2"
rayon = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
tree-sitter = "0.26.8"
tree-sitter-highlight = "0.26.8"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
tree-sitter-zsh = "0.63.3"
toml = "1.1"
expectrl = "0.9"
regex = "1.10"
tempfile = "3.8"
googletest = "0.14.2"

[profile.release]
codegen-units = 1           # reduces binary size by ~2%
debug = "full"              # No one needs an undebuggable release binary
lto = true                  # reduces binary size by ~14%
opt-level = "s"             # reduces binary size by ~25%
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%
incremental = true          # Improves re-compile times
